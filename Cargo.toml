[package]
name = "clipstack"
version = "0.1.0"
rust-version = "1.89"
edition = "2024"
description = "Fast clipboard manager with lazy-loading history picker"
license = "MIT"

[[bin]]
name = "clipstack"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.29"
crossterm = "0.28"
sha2 = "0.10"
dirs = "5"
anyhow = "1"
fuzzy-matcher = "0.3"
ctrlc = { version = "3.5", features = ["termination"] }
fs2 = "0.4"
rusqlite = { version = "0.41", features = ["bundled"] }
regex = "1.13"
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }

[dev-dependencies]
tempfile = "3"
